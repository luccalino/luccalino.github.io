<header>
  <svg id="header-routes" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <script>
    (function () {
      // Draws every ride/run in data/routes.json as its own SVG path,
      // staggered so the whole set finishes drawing TOTAL_MS after the
      // data arrives (not a fixed timer from page load - see the
      // header.html git history for why that distinction matters on a
      // slow connection). Paths are colored via CSS (stroke:
      // var(--nav-hover-accent) in _base.scss) so they - unlike the
      // flattened PNG this replaced - recolor instantly on theme toggle
      // with no separate filter needed.
      // Deliberately does NOT check prefers-reduced-motion: the "Welcome,
      // dear visitor" TypeIt animation right next to it doesn't either, so
      // gating just this one animation on that setting made the header
      // look completely static (no motion at all, not even a lesser
      // amount) for anyone with it on - inconsistent with the rest of the
      // page and confusing since nothing else here signals that it's
      // intentional.
      // TOTAL_MS matches the "Welcome, dear friend!" TypeIt sequence's own
      // total run time (startDelay + every type/pause/delete/move step),
      // measured empirically in a browser rather than hand-summed from its
      // step list - TypeIt doesn't expose that total as a number anywhere
      // to read it back from.
      var TOTAL_MS = 12200;
      var PER_ROUTE_MS = 2500;
      var svg = document.getElementById('header-routes');
      var SVG_NS = 'http://www.w3.org/2000/svg';

      function draw(routesDoc) {
        var xlim = routesDoc.xlim, ylim = routesDoc.ylim;
        var xmin = xlim[0], xmax = xlim[1];
        var ymin = ylim[0], ymax = ylim[1];
        var routes = routesDoc.routes;
        var n = routes.length;

        var frag = document.createDocumentFragment();
        var paths = routes.map(function (route) {
          var d = route.map(function (pt, i) {
            var x = (pt[0] - xmin) / (xmax - xmin) * 1000;
            var y = (ymax - pt[1]) / (ymax - ymin) * 1000;
            return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
          }).join('');
          var path = document.createElementNS(SVG_NS, 'path');
          path.setAttribute('d', d);
          path.setAttribute('class', 'header-route');
          frag.appendChild(path);
          return path;
        });
        svg.appendChild(frag);

        paths.forEach(function (path, i) {
          var len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          var delay = n > 1 ? (i / (n - 1)) * (TOTAL_MS - PER_ROUTE_MS) : 0;
          path.animate(
            [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: PER_ROUTE_MS, delay: delay, easing: 'ease-out', fill: 'forwards' }
          );
        });
      }

      fetch('/data/routes.json').then(function (r) { return r.json(); }).then(draw);
    })();
  </script>
  <div class="header-content">
    <div class="header-content-inner">
      <h1 id="myElement"></h1>
      <script src="https://unpkg.com/typeit@8.2.0/dist/index.umd.js"></script>
      
      <script>
        new TypeIt("#myElement", {
          startDelay: 900,
          cursor: true,
          speed: 100,
          cursorSpeed: 800,
        })
                .type("qel", {delay: 400})
                .move(null, {to: 'START', instant: true, delay: 300})
                .move(1, {delay: 300})
                .delete(1)
                .type('W', {delay: 325})
                .pause(400)
                .move(null, {to: 'END'})
                .type('come')
                .pause(600)
                .type(', dear vistor')
                .move(-3, {delay: 350})
                .type('i')
                .move(null, {to: 'END'})
                .type('!')
                .delete(1)
                .delete(1)
                .delete(1)
                .delete(1)
                .delete(1, {delay: 900, instant: true})
                .delete(1)
                .delete(1)
                .delete(1)
                .pause(600)
                .type('guest?', {delay: 325})
                .pause(400)
                .delete(1)
                .type('!')
                .delete(1)
                .delete(1)
                .delete(1)
                .delete(1)
                .delete(1)
                .delete(1)
                .pause(700)
                .type('friend!')
        .go();
      </script>

      <hr style="border:3px solid $theme-primary;">
      <p>Please find on my website materials of some of my recent endeavors.</p>
    </div>
  </div>
  
  <p style="position:absolute; bottom:0; right:0; margin-right: 20px; color: var(--color-accent); font-size: 8px;">&#169; 2026 LAZ. <a href="https://github.com/luccalino/luccalino.github.io" style="color: var(--color-accent);">Source code.</a></p>
</header>

<style>
  #myElement {
    font-size: 5vw; /* Responsive font size */
  }

  /* TypeIt gives the cursor its own default color rather than inheriting
     the heading's - force it to track the same theme-aware color as the
     surrounding text (navy in the default theme, the orange accent only
     in the orange theme) instead of a fixed color in both. */
  #myElement .ti-cursor {
    color: var(--color-accent) !important;
  }

  #myElement .ti-cursor {
    font-size: 5vw; /* Responsive cursor size */
  }

  @media (min-width: 1200px) {
    #myElement {
      font-size: 3vw;
    }
    #myElement .ti-cursor {
      font-size: 3vw;
    }
  }

  @media (max-width: 768px) {
    #myElement {
      font-size: 6vw;
    }
    #myElement .ti-cursor {
      font-size: 6vw;
    }
  }

  @media (max-width: 480px) {
    #myElement {
      font-size: 8vw;
    }
    #myElement .ti-cursor {
      font-size: 8vw;
    }
  }
</style>

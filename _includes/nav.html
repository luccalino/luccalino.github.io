<style>
    /* Sits as the last nav item so it always has its own reserved space -
       inherits the navbar's own fixed-top/collapse behavior for free,
       instead of floating independently and risking overlap with it.
       Deliberately unstyled as a "button" - no border/background/pill - so
       it reads as plain nav text, matching its siblings' size and baseline.
       Its color comes from _sass/_base.scss (#theme-toggle rules), which
       track whatever color the surrounding nav links have in each state. */
    #theme-toggle-item {
        display: flex;
        align-items: center;
    }
    #theme-toggle {
        background: none;
        border: none;
        padding: 15px 15px;
        margin: 0;
        font-family: 'Open Sans', 'Helvetica Neue', Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .03em;
        line-height: 20px;
        cursor: pointer;
        transition: color .25s;
    }
    @media (max-width: 767px) {
        #theme-toggle {
            padding: 8px 15px;
        }
    }
</style>

<script>
    (function () {
        var STORAGE_KEY = 'laz-theme';
        var btn = document.getElementById('theme-toggle');
        var labelEl = btn.querySelector('.theme-toggle-label');

        function labelFor(theme) {
            return theme === 'classic' ? 'Modern' : 'Classic';
        }

        function apply(theme) {
            if (theme === 'classic') {
                document.documentElement.setAttribute('data-theme', 'classic');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            labelEl.textContent = labelFor(theme);
        }

        btn.addEventListener('click', function () {
            var isClassic = document.documentElement.getAttribute('data-theme') === 'classic';
            var next = isClassic ? 'current' : 'classic';
            try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
            apply(next);
        });

        // Sync the label with whatever head.html's early script already applied.
        apply(document.documentElement.getAttribute('data-theme') === 'classic' ? 'classic' : 'current');
    })();
</script>

<style>
    /* Sits as the last nav item so it always has its own reserved space -
       inherits the navbar's own fixed-top/collapse behavior for free,
       instead of floating independently and risking overlap with it.
       Icon-only (a ring that gains a filled dot when the orange theme is
       active, like a selected radio button) - no text label, sized/aligned
       to match its sibling nav links. Its color comes from
       _sass/_base.scss (#theme-toggle rules), which track whatever color
       the surrounding nav links have in each state. */
    #theme-toggle-item {
        display: flex;
        align-items: center;
    }
    #theme-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        /* Match the sibling nav links' full box height (15px padding +
           20px line-height, Bootstrap's .navbar-nav > li > a) exactly, not
           just their padding - otherwise this shorter box's own centering
           doesn't land on the same middle as the taller text links next to
           it, and the icon reads as sitting a few px high. */
        padding: 15px 15px;
        height: 50px;
        box-sizing: border-box;
        margin: 0;
        cursor: pointer;
        transition: color .25s;
    }
    #theme-toggle .theme-toggle-dot {
        opacity: 0;
        transition: opacity .2s;
    }
    :root[data-theme="orange"] #theme-toggle .theme-toggle-dot {
        opacity: 1;
    }
    @media (max-width: 767px) {
        #theme-toggle {
            padding: 10px 15px;
            height: 40px;
        }
    }
</style>

<script>
    (function () {
        var STORAGE_KEY = 'laz-theme';
        var btn = document.getElementById('theme-toggle');

        function labelFor(theme) {
            return theme === 'orange' ? 'Switch to the original theme' : 'Switch to the orange theme';
        }

        function apply(theme) {
            if (theme === 'orange') {
                document.documentElement.setAttribute('data-theme', 'orange');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            btn.setAttribute('aria-label', labelFor(theme));
        }

        btn.addEventListener('click', function () {
            var isOrange = document.documentElement.getAttribute('data-theme') === 'orange';
            var next = isOrange ? 'original' : 'orange';
            try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
            apply(next);
        });

        // Sync with whatever head.html's early script already applied.
        apply(document.documentElement.getAttribute('data-theme') === 'orange' ? 'orange' : 'original');
    })();
</script>
